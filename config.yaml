aws:
  region: us-west-2
  profile_name: workshop
  # 模型評分檔的來源（api/services/score_cache.py 於冷啟動下載）。
  # 此 bucket 公開存取全封鎖，符合 NOTICE.md 對衍生資料只在私有 S3 流通的要求。
  # 可用環境變數 SCORES_BUCKET 覆寫。
  bucket_name: demo-20260912
  s3_prefixes:
    raw: raw/
    curated: curated/
    features: features/
    models: models/
    scores: scores/
    opinion: opinion/
    web: web/

model:
  weights:
    penalty: 0.45
    residual: 0.20
    isolation_forest: 0.15
    opinion: 0.10
    flags: 0.10
  peer_groups:
    - 市立幼兒園
    - 非營利園

security:
  # 對外開放連線的 IP 白名單。
  # 後端：寫入 API Gateway resource policy（非清單來源一律 Deny）
  # 前端：寫入 WAF IPSet 並掛在 CloudFront distribution 上
  # 留空則不設限制（僅建議用於本機測試）
  allowed_ips:
    - 60.250.71.45/32
    - 61.222.117.53/32
    - 59.125.121.41/32
    - 60.250.71.43/32

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "*"
