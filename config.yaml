aws:
  region: us-west-2
  profile_name: workshop
  bucket_name: demo-20260912
  execution_role_arn: arn:aws:iam::123456789012:role/kiro-sagemaker-execution-role
  s3_prefixes:
    raw: raw/
    curated: curated/
    features: features/
    models: models/
    scores: scores/
    opinion: opinion/
    web: web/

model:
  weights:
    penalty: 0.40
    residual: 0.20
    isolation_forest: 0.15
    opinion: 0.10
    flags: 0.15
  peer_groups:
    - 市立幼兒園
    - 非營利園

security:
  # 對外開放連線的 IP 白名單。
  # 後端：寫入 API Gateway resource policy（非清單來源一律 Deny）
  # 前端：寫入 WAF IPSet 並掛在 CloudFront distribution 上
  # 留空則不設限制（僅建議用於本機測試）
  allowed_ips:
    - 60.250.71.45/32
    - 61.222.117.53/32
    - 59.125.121.41/32
    - 60.250.71.43/32

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "*"
